<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprout (ऊब) — High-Expression Mascot Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0A1618;
      color: #F5F5F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 25px 15px;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 18px;
      max-width: 600px;
    }
    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background-color: #14282B;
      border: 1px solid rgba(227, 160, 111, 0.4);
      color: #E3A06F;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #F5F5F0;
      margin-bottom: 4px;
    }
    p {
      color: #A3B9BD;
      font-size: 13px;
    }
    .preview-card {
      background: radial-gradient(circle at 50% 30%, #1D3A3F 0%, #14282B 65%, #0B1719 100%);
      border: 1.5px solid rgba(227, 160, 111, 0.35);
      border-radius: 32px;
      padding: 26px 20px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    /* Mascot Stage */
    .mascot-stage {
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 10px;
    }
    /* Speech Bubble */
    .speech-bubble {
      background-color: #FFFFFF;
      color: #14282B;
      padding: 13px 20px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
      max-width: 360px;
      min-height: 52px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      line-height: 1.4;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 8px 8px 8px;
      border-style: solid;
      border-color: transparent transparent #FFFFFF transparent;
    }
    /* Controls Grid */
    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      width: 100%;
    }
    .btn-state {
      padding: 12px 10px;
      background-color: #182E32;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      color: #F5F5F0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.2s ease;
    }
    .btn-state:hover {
      background-color: #24464C;
      transform: translateY(-2px);
    }
    .btn-state.active {
      background-color: #526140;
      border-color: #E3A06F;
      color: #FFFFFF;
      box-shadow: 0 4px 18px rgba(82, 97, 64, 0.6);
      transform: scale(1.02);
    }
    .btn-celebrate {
      grid-column: span 2;
      background: linear-gradient(135deg, #9C6707 0%, #E3A06F 100%);
      color: #14282B;
      font-size: 13px;
      font-weight: 800;
      border: none;
    }
    .btn-celebrate.active {
      box-shadow: 0 0 30px rgba(227, 160, 111, 0.9);
    }

    /* ================= KEYFRAME ANIMATIONS ================= */
    @keyframes gentleSway {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes waveArm {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg); }
    }
    @keyframes leafWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
    @keyframes blink {
      0%, 95%, 100% { transform: scaleY(1); }
      97.5% { transform: scaleY(0.08); }
    }
    @keyframes deepBreathe {
      0%, 100% { transform: scale(0.92) translateY(5px); }
      40%, 60% { transform: scale(1.12) translateY(-8px); }
    }
    @keyframes steamFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.7); }
      50% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(-16px) scale(1.3); }
    }
    @keyframes joyDance {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      25% { transform: translateY(-18px) rotate(-6deg) scale(1.08); }
      50% { transform: translateY(0px) rotate(0deg) scale(0.96); }
      75% { transform: translateY(-12px) rotate(6deg) scale(1.05); }
    }
    @keyframes lanternBeam {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(227, 160, 111, 0.6)); opacity: 0.85; }
      50% { filter: drop-shadow(0 0 28px rgba(227, 160, 111, 1)); opacity: 1; }
    }
    @keyframes starTwinkle {
      0%, 100% { transform: scale(0.4) rotate(0deg); opacity: 0.2; }
      50% { transform: scale(1.2) rotate(45deg); opacity: 1; }
    }
    @keyframes zzzFloat {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translate(16px, -24px) scale(1.2); }
    }

    /* ================= STATE STYLING & MORPHS ================= */
    
    /* 1. GENTLE GREETING */
    .state-greeting .mascot-svg { animation: gentleSway 3.5s ease-in-out infinite; }
    .state-greeting .left-arm-wave { animation: waveArm 1.5s ease-in-out infinite; transform-origin: 55px 115px; }
    .state-greeting .leaf-group { animation: leafWiggle 3s ease-in-out infinite; transform-origin: 100px 45px; }
    .state-greeting .eye-pupils { animation: blink 4s infinite; transform-origin: center 95px; }
    .state-greeting .mouth-smile { opacity: 1; }

    /* 2. LISTENING / 10-Q FLOW (Focused, caring head tilt) */
    .state-listening .mascot-svg { transform: rotate(-3deg) translateY(-2px); transition: transform 0.4s ease; }
    .state-listening .eyebrows-listening { opacity: 1 !important; }
    .state-listening .mouth-smile { opacity: 1; }
    .state-listening .lantern-glow { animation: lanternBeam 2s infinite; }
    .state-listening .leaf-group { transform: rotate(-8deg); transform-origin: 100px 45px; }

    /* 3. COZY / OVERWHELMED SUPPORT (Blanket, steam tea, soft eyes) */
    .state-cozy .mascot-svg { transform: translateY(6px) scale(0.97); }
    .state-cozy .scarf-wrap { opacity: 1 !important; transform: scale(1); }
    .state-cozy .mug-group { opacity: 1 !important; }
    .state-cozy .steam-particle { animation: steamFloat 2s infinite ease-out; }
    .state-cozy .eyes-cozy { opacity: 1 !important; }
    .state-cozy .eyes-normal { opacity: 0 !important; }
    .state-cozy .blush-cheeks { fill: #FF8F6B !important; opacity: 0.8 !important; }

    /* 4. 4-7-8 BREATHING (Synchronized Expansion) */
    .state-breathing .mascot-svg { animation: deepBreathe 8s ease-in-out infinite; transform-origin: center bottom; }
    .state-breathing .eyes-breathing { opacity: 1 !important; }
    .state-breathing .eyes-normal { opacity: 0 !important; }
    .state-breathing .mouth-breathe { opacity: 1 !important; }
    .state-breathing .mouth-smile { opacity: 0 !important; }
    .state-breathing .breathing-aura { opacity: 0.6 !important; animation: lanternBeam 8s infinite; }

    /* 5. JOY / MILESTONE UNLOCK (Celebratory jumps, star eyes, fireflies) */
    .state-joy .mascot-svg { animation: joyDance 1s ease-in-out infinite; }
    .state-joy .eyes-star { opacity: 1 !important; }
    .state-joy .eyes-normal { opacity: 0 !important; }
    .state-joy .mouth-joy { opacity: 1 !important; }
    .state-joy .mouth-smile { opacity: 0 !important; }
    .state-joy .sparkle-stars { opacity: 1 !important; }
    .state-joy .star-anim-1 { animation: starTwinkle 1.2s infinite; transform-origin: 40px 40px; }
    .state-joy .star-anim-2 { animation: starTwinkle 1.5s infinite 0.3s; transform-origin: 160px 35px; }
    .state-joy .star-anim-3 { animation: starTwinkle 1.1s infinite 0.6s; transform-origin: 170px 90px; }
    .state-joy .lantern-group { transform: translateY(-22px) rotate(-12deg); }
    .state-joy .lantern-glow { filter: drop-shadow(0 0 35px #FFDDB3); }

    /* 6. NIGHTTIME SLEEPY */
    .state-night .mascot-svg { transform: translateY(4px); }
    .state-night .nightcap { opacity: 1 !important; }
    .state-night .eyes-sleepy { opacity: 1 !important; }
    .state-night .eyes-normal { opacity: 0 !important; }
    .state-night .zzz-particles { opacity: 1 !important; animation: zzzFloat 2.5s infinite; }
    .state-night .mouth-sleepy { opacity: 1 !important; }
    .state-night .mouth-smile { opacity: 0 !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">Character Animation Prototype</div>
    <h1>Sprout (ऊब) — High-Expression Companion</h1>
    <p>Dynamic emotion morphing for check-ins, questionnaires, breathing & sanctuary</p>
  </div>

  <div class="preview-card state-greeting" id="cardContainer">
    <!-- Speech Dialogue Bubble -->
    <div class="speech-bubble" id="speechText">
      "Hello! Welcome to your safe space. Take your time today."
    </div>

    <!-- Mascot Stage -->
    <div class="mascot-stage">
      <svg class="mascot-svg" width="200" height="210" viewBox="0 0 200 210" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Ambient Background Glow -->
        <circle cx="100" cy="120" r="75" fill="rgba(82, 97, 64, 0.22)" filter="blur(25px)" />
        <circle class="breathing-aura" cx="100" cy="120" r="90" fill="rgba(227, 160, 111, 0.25)" filter="blur(30px)" opacity="0" style="transition: opacity 0.5s;" />

        <!-- Star Confetti (Joy State) -->
        <g class="sparkle-stars" opacity="0" style="transition: opacity 0.3s;">
          <path class="star-anim-1" d="M 40 35 Q 40 45 30 45 Q 40 45 40 55 Q 40 45 50 45 Q 40 45 40 35 Z" fill="#FFDDB3" />
          <path class="star-anim-2" d="M 160 30 Q 160 40 150 40 Q 160 40 160 50 Q 160 40 170 40 Q 160 40 160 30 Z" fill="#E3A06F" />
          <path class="star-anim-3" d="M 170 85 Q 170 93 162 93 Q 170 93 170 101 Q 170 93 178 93 Q 170 93 170 85 Z" fill="#FFDDB3" />
        </g>

        <!-- Zzz Floating Particles (Night State) -->
        <g class="zzz-particles" opacity="0" transform="translate(130, 40)" style="transition: opacity 0.3s;">
          <text x="0" y="0" fill="#E3A06F" font-size="16" font-family="monospace" font-weight="bold">Z</text>
          <text x="10" y="-12" fill="#FFDDB3" font-size="12" font-family="monospace" font-weight="bold">z</text>
          <text x="18" y="-22" fill="#FFFFFF" font-size="9" font-family="monospace" font-weight="bold">z</text>
        </g>

        <!-- Leaf Sprout on Head (Morphs & Wiggles) -->
        <g class="leaf-group" transform="translate(100, 48)">
          <path d="M 0 0 C -15 -22, -22 -38, 0 -45 C 22 -38, 15 -22, 0 0 Z" fill="#526140" />
          <path d="M 0 -6 C -10 -20, -12 -30, 0 -40" stroke="#7BA867" stroke-width="2" stroke-linecap="round" />
          <circle cx="0" cy="-45" r="3.5" fill="#E3A06F" />
        </g>

        <!-- Main Chubby Body (Pebble Spirit) -->
        <path d="M 50 115 C 50 70, 150 70, 150 115 C 150 160, 138 175, 100 175 C 62 175, 50 160, 50 115 Z" fill="#F5F5F0" />
        <!-- Soft Cream Belly -->
        <path d="M 66 125 C 66 98, 134 98, 134 125 C 134 156, 124 165, 100 165 C 76 165, 66 156, 66 125 Z" fill="#E8EADB" />

        <!-- Warm Woolen Scarf (Cozy State) -->
        <g class="scarf-wrap" opacity="0" style="transition: all 0.3s ease;">
          <path d="M 54 120 C 72 135, 128 135, 146 120 C 152 132, 140 142, 100 142 C 60 142, 48 132, 54 120 Z" fill="#815505" />
          <path d="M 120 132 L 130 168 L 114 168 Z" fill="#6A4604" />
          <line x1="114" y1="168" x2="130" y2="168" stroke="#FFDDB3" stroke-width="2" stroke-dasharray="2,2" />
        </g>

        <!-- Left Arm (Waving or Resting) -->
        <g class="left-arm-wave">
          <path d="M 54 120 Q 38 112 35 102" stroke="#F5F5F0" stroke-width="8" stroke-linecap="round" fill="none" />
        </g>

        <!-- EYEBROWS (Expressive Emotion Drivers) -->
        <g class="eyebrows-group">
          <!-- Listening/Curious Eyebrows -->
          <path class="eyebrows-listening" opacity="0" d="M 72 80 Q 82 76 90 80 M 110 80 Q 118 76 128 80" stroke="#526140" stroke-width="2.5" stroke-linecap="round" fill="none" style="transition: opacity 0.3s;" />
        </g>

        <!-- ================= EYES MORPHS ================= -->
        <!-- 1. Normal Big Sparkle Eyes -->
        <g class="eyes-normal eye-pupils" style="transition: opacity 0.2s;">
          <ellipse cx="80" cy="98" rx="5.5" ry="7.5" fill="#14282B" />
          <circle cx="78" cy="95" r="2.3" fill="#FFFFFF" />
          <circle cx="82" cy="101" r="1.2" fill="#FFFFFF" />

          <ellipse cx="120" cy="98" rx="5.5" ry="7.5" fill="#14282B" />
          <circle cx="118" cy="95" r="2.3" fill="#FFFFFF" />
          <circle cx="122" cy="101" r="1.2" fill="#FFFFFF" />
        </g>

        <!-- 2. Cozy Happy Crescent Eyes -->
        <g class="eyes-cozy" opacity="0" style="transition: opacity 0.2s;">
          <path d="M 74 98 Q 80 91 86 98" stroke="#14282B" stroke-width="3" stroke-linecap="round" fill="none" />
          <path d="M 114 98 Q 120 91 126 98" stroke="#14282B" stroke-width="3" stroke-linecap="round" fill="none" />
        </g>

        <!-- 3. Breathing Peaceful Closed Eyes -->
        <g class="eyes-breathing" opacity="0" style="transition: opacity 0.2s;">
          <path d="M 74 97 Q 80 102 86 97" stroke="#526140" stroke-width="2.5" stroke-linecap="round" fill="none" />
          <path d="M 114 97 Q 120 102 126 97" stroke="#526140" stroke-width="2.5" stroke-linecap="round" fill="none" />
        </g>

        <!-- 4. Star Sparkle Eyes (Joy) -->
        <g class="eyes-star" opacity="0" style="transition: opacity 0.2s;">
          <polygon points="80,90 82,95 87,97 82,99 80,104 78,99 73,97 78,95" fill="#E3A06F" />
          <polygon points="120,90 122,95 127,97 122,99 120,104 118,99 113,97 118,95" fill="#E3A06F" />
        </g>

        <!-- 5. Sleepy Slanted Eyes -->
        <g class="eyes-sleepy" opacity="0" style="transition: opacity 0.2s;">
          <path d="M 74 98 L 86 100" stroke="#14282B" stroke-width="2.5" stroke-linecap="round" />
          <path d="M 126 98 L 114 100" stroke="#14282B" stroke-width="2.5" stroke-linecap="round" />
        </g>

        <!-- Rosy Blush Cheeks -->
        <circle class="blush-cheeks" cx="68" cy="107" r="6" fill="#E3A06F" opacity="0.6" style="transition: all 0.3s;" />
        <circle class="blush-cheeks" cx="132" cy="107" r="6" fill="#E3A06F" opacity="0.6" style="transition: all 0.3s;" />

        <!-- ================= MOUTH MORPHS ================= -->
        <!-- Normal Cute Smile -->
        <path class="mouth-smile" d="M 94 109 Q 100 115 106 109" stroke="#14282B" stroke-width="2.5" stroke-linecap="round" fill="none" style="transition: opacity 0.2s;" />
        <!-- Big Joy Open Mouth -->
        <path class="mouth-joy" opacity="0" d="M 92 108 Q 100 120 108 108 Z" fill="#BA1A1A" stroke="#14282B" stroke-width="2" style="transition: opacity 0.2s;" />
        <!-- Breathing Soft 'o' Mouth -->
        <ellipse class="mouth-breathe" opacity="0" cx="100" cy="111" rx="4" ry="5" fill="#14282B" style="transition: opacity 0.2s;" />
        <!-- Sleepy Yawn Mouth -->
        <ellipse class="mouth-sleepy" opacity="0" cx="100" cy="112" rx="5" ry="7" fill="#815505" style="transition: opacity 0.2s;" />

        <!-- Hot Steaming Tea Mug (Cozy State) -->
        <g class="mug-group" opacity="0" transform="translate(88, 128)" style="transition: opacity 0.3s;">
          <rect width="24" height="18" rx="5" fill="#815505" stroke="#FFDDB3" stroke-width="1.5" />
          <path d="M 24 4 Q 30 9 24 14" stroke="#FFDDB3" stroke-width="2" fill="none" />
          <!-- Animated Steam Lines -->
          <path class="steam-particle" d="M 6 -3 Q 10 -8 6 -13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
          <path class="steam-particle" style="animation-delay: 0.5s;" d="M 12 -3 Q 16 -8 12 -13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
          <path class="steam-particle" style="animation-delay: 1s;" d="M 18 -3 Q 22 -8 18 -13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
        </g>

        <!-- Right Arm Holding the Warmth Lantern (Logo Emblem) -->
        <g class="lantern-group" style="transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);">
          <!-- Arm -->
          <path d="M 140 120 Q 158 122 165 130" stroke="#F5F5F0" stroke-width="8" stroke-linecap="round" fill="none" />
          <!-- Cord -->
          <line x1="165" y1="130" x2="165" y2="142" stroke="#815505" stroke-width="2.5" />
          <!-- Lantern Body -->
          <rect x="153" y="142" width="24" height="30" rx="5" fill="#14282B" stroke="#E3A06F" stroke-width="2" />
          <!-- Inner Glowing Heart -->
          <circle class="lantern-glow" cx="165" cy="157" r="9" fill="#E3A06F" />
          <path d="M 161 156 A 2.5 2.5 0 0 1 165 153 A 2.5 2.5 0 0 1 169 156 Q 169 160 165 163 Q 161 160 161 156 Z" fill="#FFFFFF" />
        </g>
      </svg>
    </div>

    <!-- Emotion Controller Buttons (6 High-Expression States) -->
    <div class="controls">
      <button class="btn-state active" onclick="setMascotState('greeting', this)">
        👋 <span>Gentle Greeting</span>
      </button>
      <button class="btn-state" onclick="setMascotState('listening', this)">
        🤔 <span>10-Q Deep Focus</span>
      </button>
      <button class="btn-state" onclick="setMascotState('cozy', this)">
        ☕ <span>Comforting Hug</span>
      </button>
      <button class="btn-state" onclick="setMascotState('breathing', this)">
        🧘 <span>4-7-8 Breathing</span>
      </button>
      <button class="btn-state" onclick="setMascotState('night', this)">
        🌙 <span>Night Sanctuary</span>
      </button>
      <button class="btn-state btn-celebrate" onclick="setMascotState('joy', this)">
        🎉 <span>Super Joy / Milestone Unlock</span>
      </button>
    </div>
  </div>

  <script>
    const dialogs = {
      greeting: '"Hello! Welcome to your safe sanctuary. Take your time today."',
      listening: '"I am listening with an open heart. How did that feel for you?"',
      cozy: '"Feeling overwhelmed? Wrap up warm. I am sitting right here with you."',
      breathing: '"Breathe in slowly with me... 1... 2... 3... 4... hold... and release."',
      night: '"Late night study session? Remember to rest. Rest is part of the work."',
      joy: '"🎉 Incredible! You just unlocked the Self-Awareness Anchor Badge! ✨"'
    };

    function setMascotState(state, btn) {
      const container = document.getElementById('cardContainer');
      const text = document.getElementById('speechText');
      
      // Update Class
      container.className = 'preview-card state-' + state;
      text.innerText = dialogs[state] || dialogs.greeting;

      // Update Button Active state
      document.querySelectorAll('.btn-state').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
  </script>
</body>
</html>
